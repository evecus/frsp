[package]
name = "frsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "High-performance domain/IP/port ruleset compiler and matcher for proxies (AdGuard / mihomo / Clash / sing-box). Binary format .frs powered by FST."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/evecus/frsp"
homepage = "https://github.com/evecus/frsp"
keywords = ["ruleset", "domain", "geosite", "proxy", "fst"]
categories = ["network-programming", "parsing"]
authors = ["jamie55@163.com"]                 # TODO: 改成你的信息

[dependencies]
# 核心匹配引擎（FST 是 .frs 二进制格式的基础）
fst = "0.4"
aho-corasick = "1.1"
regex = "1.10"

# 错误处理
thiserror = "1.0"

# 序列化（sing-box JSON / mihomo YAML）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 零拷贝加载本地 .frs 文件
memmap2 = "0.9"

ahash = "0.8" 

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
